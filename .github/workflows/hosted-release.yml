name: Hosted frontend release

on:
  push:
    branches: [main]
    paths:
      - 'app/(public)/privacy-policy/extension/page.tsx'
      - '.github/workflows/hosted-release.yml'
      - 'scripts/hosted-release-guard.sh'
      - 'scripts/hosted-release-guard.test.py'
      - 'scripts/hosted-release-source-race.test.py'
      - 'scripts/release.sh'

# One running eligible release and one latest pending eligible push. Never cancel a rollout watch.
concurrency:
  group: hosted-frontend-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') && !startsWith(github.event.head_commit.message, 'release-admin:') && !startsWith(github.event.head_commit.message, 'release-demos:') && !startsWith(github.event.head_commit.message, 'release-all:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Skip a release head or stale checkout before installing dependencies
        id: initial_source
        run: bash scripts/hosted-release-guard.sh
      - name: Check existing release credentials
        if: steps.initial_source.outputs.proceed == 'true'
        env:
          AIDREAM_REPO_TOKEN: ${{ secrets.AIDREAM_REPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          for name in AIDREAM_REPO_TOKEN VERCEL_TOKEN NEXT_PUBLIC_SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing existing repository secret: $name"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        if: steps.initial_source.outputs.proceed == 'true'
      - uses: actions/setup-node@v4
        if: steps.initial_source.outputs.proceed == 'true'
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        if: steps.initial_source.outputs.proceed == 'true'
      - name: Check out the existing private release companion
        if: steps.initial_source.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: AI-Matrix-Engine/aidream
          path: aidream
          token: ${{ secrets.AIDREAM_REPO_TOKEN }}
          persist-credentials: false
      - name: Install the committed frontend dependency graph
        if: steps.initial_source.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Prove the migration and push-race guards still refuse unsafe candidates
        if: steps.initial_source.outputs.proceed == 'true'
        run: |
          python3 scripts/hosted-release-guard.test.py
          python3 scripts/hosted-release-source-race.test.py
      - name: Recheck current main and migration census
        id: source
        if: steps.initial_source.outputs.proceed == 'true'
        run: bash scripts/hosted-release-guard.sh
      # The after phase runs the same check rows as repo-only-checks.yml on the same 4-core / 16 GB
      # runner, beside the rollout watch. Run 39162960893 (v0.4.3343) had no swap: the release went
      # LIVE at 20:34:29Z, the 15 s rollout polls had already stretched to 86-126 s (the machine was
      # thrashing), and the step died with exit 143 at 20:49:37Z before run.mjs wrote any finding.
      # repo-only-checks.yml carries this swap and passes every run while using up to 6.2 GB of it.
      - name: Add 8 GB of swap
        if: steps.source.outputs.proceed == 'true'
        run: |
          sudo fallocate -l 8G /matrx-swap && sudo chmod 600 /matrx-swap
          sudo mkswap /matrx-swap >/dev/null && sudo swapon /matrx-swap
          free -m
      # The release and the verdict are separate steps: a step killed after the release went live
      # (memory, a signal) must still leave a verdict that says the release is live and the checks
      # are unmeasured — never "failed" with nothing written, which reads as a release that is not live.
      - name: Release and wait for every existing after-phase check and rollout verdict
        id: release
        if: steps.source.outputs.proceed == 'true'
        continue-on-error: true
        env:
          AIDREAM_DIR: ${{ github.workspace }}/aidream
          RELEASE_EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Run 39170774433 (v0.4.3346) went LIVE, then its verdict failed on two rows that could not
          # run here: the surface mirror ("missing SUPABASE_MATRIX_USER, …") and the npm publish-lag
          # check (`gh` had no token for AI-Matrix-Engine/aidream). Both secrets exist on this repo.
          # check-npm-publish-lag.mjs hands AIDREAM_REPO_TOKEN to its aidream `gh` calls only.
          AIDREAM_REPO_TOKEN: ${{ secrets.AIDREAM_REPO_TOKEN }}
          SUPABASE_MATRIX_USER: ${{ secrets.SUPABASE_MATRIX_USER }}
          SUPABASE_MATRIX_PASSWORD: ${{ secrets.SUPABASE_MATRIX_PASSWORD }}
          SUPABASE_MATRIX_HOST: ${{ secrets.SUPABASE_MATRIX_HOST }}
          SUPABASE_MATRIX_PORT: ${{ secrets.SUPABASE_MATRIX_PORT }}
          SUPABASE_MATRIX_DATABASE_NAME: ${{ secrets.SUPABASE_MATRIX_DATABASE_NAME }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p tmp/checks
          # Memory every 20 s, into the artifact AND this step's own log: run 39162960893's abort
          # skipped every later step (its post steps too), so an artifact alone would not survive
          # the failure it is meant to explain. The loop writes to the step log, never to the tee'd
          # release stdout the verdict parses.
          ( while sleep 20; do echo "[mem] $(date -u +%T) $(free -m | awk '/^Mem:/{m="used_mb="$3" available_mb="$7} /^Swap:/{s=" swap_used_mb="$3} END{print m s}')"; done ) 2>&1 | tee tmp/checks/memory.log &
          set -o pipefail
          bash scripts/release.sh --no-migrate --with-checks | tee "$RUNNER_TEMP/hosted-release.stdout"
      - name: Verdict — pushed, live, and every after-phase finding
        if: always() && steps.source.outputs.proceed == 'true'
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          stdout="$RUNNER_TEMP/hosted-release.stdout"
          tag="$(sed -n 's/^\(v[0-9][0-9.]*\)  pushed, build started.*/\1/p' "$stdout" 2>/dev/null | tail -1)"
          if [ -z "$tag" ]; then
            echo "::error::Release script did not report a pushed release (release step: ${RELEASE_OUTCOME})"
            exit 1
          fi
          live=false
          grep -q "Released and LIVE — ${tag}" "$stdout" && live=true
          findings="tmp/release-logs/findings-${tag}.jsonl"
          node - "$findings" "$tag" "$live" "$RELEASE_OUTCOME" <<'NODE'
          const fs = require('node:fs');
          const [file, tag, live, outcome] = process.argv.slice(2);
          const read = (path) => fs.existsSync(path)
            ? fs.readFileSync(path, 'utf8').split('\n').filter(Boolean).map(JSON.parse) : null;
          const rows = read(file);
          // The rollout/manifest/surface findings land in <findings>.rollout first and are folded
          // into the findings file only when the whole after phase finishes; read them either way.
          const rollout = rows ? [] : (read(`${file}.rollout`) || []);
          const errors = [...(rows || []), ...rollout].filter((row) => row.level === 'error' || row.level === 'ERROR');
          for (const row of errors) console.error(`::error title=${row.category}::${row.title}`);
          if (errors.length) process.exit(1);
          if (rows) {
            if (outcome !== 'success') {
              console.error(`::error title=After phase::${tag}: findings were written but the release step ended ${outcome}`);
              process.exit(1);
            }
            console.log('Release after-phase checks and rollout completed without error findings.');
            process.exit(0);
          }
          if (live !== 'true') {
            console.error(`::error title=Rollout::${tag} was pushed but never reported LIVE, and its after phase wrote no findings (release step: ${outcome})`);
            process.exit(1);
          }
          // LIVE, but the step ended before the check runner wrote its findings: the release is
          // live and the checks are UNMEASURED. Recorded as a finding (uploaded below) and announced.
          const unmeasured = { check: 'hosted-release-after-phase', category: 'Checks', level: 'warning',
            title: `UNMEASURED — ${tag} is LIVE, but its after-phase checks were interrupted (release step: ${outcome}) before writing findings; see the memory log artifact`,
            remedy: 'node scripts/checks/run.mjs --skip-live-db --json tmp/release-logs/findings-rerun.jsonl' };
          fs.mkdirSync(require('node:path').dirname(file), { recursive: true });
          fs.writeFileSync(file, [JSON.stringify({ ran: [], interrupted: true, release_step: outcome }), JSON.stringify(unmeasured)].join('\n') + '\n');
          console.log(`::warning title=Checks UNMEASURED::${unmeasured.title}`);
          NODE
      - name: Upload the release findings, logs and memory trace
        if: always() && steps.source.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-release-logs
          path: |
            tmp/release-logs/
            tmp/checks/*.log
          if-no-files-found: warn
          retention-days: 7
