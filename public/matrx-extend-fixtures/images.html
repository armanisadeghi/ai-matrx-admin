<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrx Extend image capture fixture v1</title>
  </head>
  <body>
    <main>
      <h1>Matrx Extend image capture fixture v1</h1>
      <p>Controlled, synthetic images for checking image capture and size grouping.</p>
      <figure>
        <img src="https://www.aimatrx.com/matrx-extend-fixtures/harbor-scene.svg" width="640" height="480" alt="Harbor scene with a coral sailboat and blue hills">
        <figcaption>Harbor scene, 640 × 480</figcaption>
      </figure>
      <figure>
        <img src="https://www.aimatrx.com/matrx-extend-fixtures/parcel-card.svg" width="96" height="96" alt="Amber parcel card with a white package">
        <figcaption>Parcel card, 96 × 96</figcaption>
      </figure>
      <figure>
        <img src="https://www.aimatrx.com/matrx-extend-fixtures/green-marker.svg" width="32" height="32" alt="Green circular marker with a white dot">
        <figcaption>Green marker, 32 × 32</figcaption>
      </figure>
    </main>
  </body>
</html>
